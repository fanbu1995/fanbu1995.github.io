<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Conformal calibration for individualized causal inference</title>
  <desc id="desc">Identical patient estimates are shown against a fixed interval with poor coverage and a narrow adaptive interval with valid coverage.</desc>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1e2430" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 16 16" markerWidth="34" markerHeight="34" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L15,8 L1,15 Z" fill="#1e2430"/>
    </marker>
    <style>
      .ink { stroke: #1e2430; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #1e2430; stroke-width: 10; stroke-linecap: round; marker-end: url(#arrow); }
      .label { fill: #1e2430; font-family: "Manrope", "Trebuchet MS", sans-serif; font-weight: 700; }
      .title { font-size: 42px; }
      .small { font-size: 34px; }
      .dot { stroke: #1e2430; stroke-width: 6; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8f4ed"/>

  <!-- Patient data -->
  <g filter="url(#soft)">
    <path d="M55 385 Q55 360 80 360 H150 L175 395 H285 Q310 395 310 420 V590 Q310 615 285 615 H80 Q55 615 55 590 Z" fill="#f2c977" class="ink"/>
    <rect x="88" y="305" width="170" height="130" rx="16" fill="#fffdfa" class="ink" transform="rotate(4 173 370)"/>
    <circle cx="135" cy="352" r="22" fill="#70c7c4" class="ink"/>
    <path d="M103 408 Q135 375 167 408" fill="none" class="ink"/>
    <path d="M195 352 H235 M195 383 H245" fill="none" class="ink"/>
    <path d="M155 475 H205 V525 H255 V575 H205 V625 H155 V575 H105 V525 H155 Z" fill="#ee725e" class="ink" transform="translate(0 -42) scale(.72) translate(65 200)"/>
  </g>
  <text x="62" y="680" class="label title">Patient data</text>

  <!-- Causal learner -->
  <path d="M320 475 H385" class="flow"/>
  <g filter="url(#soft)">
    <rect x="405" y="390" width="205" height="150" rx="24" fill="#9abfc7" class="ink"/>
    <rect x="430" y="415" width="155" height="95" rx="13" fill="#dcecf1" class="ink"/>
    <circle cx="480" cy="460" r="7" fill="#1e2430"/>
    <circle cx="535" cy="460" r="7" fill="#1e2430"/>
    <path d="M485 485 Q508 505 532 485" fill="none" class="ink" stroke-width="5"/>
    <path d="M507 540 V575 M455 575 H560" fill="none" class="ink"/>
  </g>
  <text x="395" y="330" class="label title">Causal</text>
  <text x="395" y="375" class="label title">learning</text>

  <!-- Split paths -->
  <path d="M615 440 Q680 440 680 275 Q680 225 745 225" class="flow"/>
  <path d="M510 585 Q510 670 585 670" class="flow"/>

  <!-- Conformal calibration -->
  <g filter="url(#soft)">
    <circle cx="665" cy="670" r="74" fill="#8bd1cf" class="ink"/>
    <circle cx="665" cy="670" r="52" fill="#fff3d7" class="ink"/>
    <path d="M665 626 L704 640 V673 Q704 711 665 728 Q626 711 626 673 V640 Z" fill="#8bd1cf" class="ink"/>
    <path d="M648 676 L660 689 L684 657" fill="none" class="ink"/>
  </g>
  <text x="555" y="790" class="label small">Conformal</text>
  <text x="555" y="830" class="label small">calibration</text>
  <path d="M742 670 H785" class="flow"/>

  <!-- Identically scaled plot frames: 500 x 270 -->
  <text x="915" y="70" class="label title">Fixed interval</text>
  <path d="M820 100 V370 H1320" fill="none" class="ink"/>
  <rect x="820" y="205" width="500" height="70" fill="#f8d2c9" stroke="#db544b" stroke-width="5"/>

  <text x="895" y="470" class="label title">Conditional interval</text>
  <path d="M820 500 V770 H1320" fill="none" class="ink"/>

  <!-- Narrow adaptive ribbon follows the unchanged estimates -->
  <path d="M820 620
           C860 620 875 620 900 620
           C950 620 990 620 1020 620
           C1070 620 1105 540 1140 525
           C1180 510 1215 700 1250 710
           C1280 718 1300 700 1320 690
           L1320 730
           C1300 740 1280 758 1250 750
           C1215 740 1180 550 1140 565
           C1105 580 1070 660 1020 660
           C990 660 950 660 900 660
           C875 660 860 660 820 660 Z"
        fill="#cfe9dd" fill-opacity="0.9" stroke="#209f9c" stroke-width="5" stroke-linejoin="round"/>

  <!-- Top estimates -->
  <circle cx="900" cy="240" r="17" fill="#45c5c3" class="dot"/>
  <circle cx="1020" cy="240" r="17" fill="#36aeea" class="dot"/>
  <circle cx="1140" cy="145" r="17" fill="#ffc629" class="dot"/>
  <circle cx="1250" cy="330" r="17" fill="#78b65b" class="dot"/>

  <!-- Exact copy translated downward by 400 pixels -->
  <circle cx="900" cy="640" r="17" fill="#45c5c3" class="dot"/>
  <circle cx="1020" cy="640" r="17" fill="#36aeea" class="dot"/>
  <circle cx="1140" cy="545" r="17" fill="#ffc629" class="dot"/>
  <circle cx="1250" cy="730" r="17" fill="#78b65b" class="dot"/>

  <!-- Coverage indicators -->
  <path d="M1410 180 L1490 260 M1490 180 L1410 260" fill="none" stroke="#e75249" stroke-width="22" stroke-linecap="round"/>
  <text x="1350" y="325" fill="#d9423b" class="label small">Poor coverage</text>
  <path d="M1405 650 L1440 690 L1500 590" fill="none" stroke="#348d3f" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1350" y="750" fill="#287b34" class="label small">Valid coverage</text>
</svg>
