{% if page.title or page.subtitle %}
<header class="page-hero{% if page.bigimg %} page-hero-with-image{% endif %}"{% if page.bigimg and page.bigimg.first %}{% assign hero_image = page.bigimg.first | first %} style="--page-hero-image: url('{{ hero_image[0] | prepend: site.baseurl | replace: '//', '/' }}');"{% endif %}>
  <div class="container">
    <div class="row">
      <div class="col-lg-10 col-lg-offset-1 col-md-10 col-md-offset-1">
        <div class="{{ include.type }}-heading page-hero-inner">
          <p class="page-hero-kicker">Fan Bu</p>
          <h1>{% if page.title %}{{ page.title }}{% endif %}</h1>
          {% if page.subtitle %}
          <p class="{{ include.type }}-subheading page-hero-subheading">{{ page.subtitle }}</p>
          {% endif %}
          {% if include.type == "post" %}
          <p class="post-meta">Posted on {{ page.date | date: "%B %-d, %Y" }}</p>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</header>
{% endif %}

<script async
  src="//mathjax.rstudio.com/latest/MathJax.js?config=TeX-MML-AM_CHTML">
</script>
